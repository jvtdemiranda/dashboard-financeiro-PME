name: Pipeline

# Dois checks independentes a cada push/PR:
#
# 1. "public/ está em dia": reconstrói o dashboard (Excel/HTML) a partir do
#    CSV já tratado que está commitado, e falha se der diferente do que
#    está commitado em public/index.html. Não toca em gerar_dados.py/
#    tratar_dados.py de propósito: como as datas são uma janela rolante
#    relativa a "hoje", regenerar a base do zero nunca bate byte a byte
#    com o que foi commitado num dia diferente — isso deixaria esse check
#    vermelho pra sempre a partir do dia seguinte.
#
# 2. "pipeline roda sem erro": smoke test de ponta a ponta (gerar dado sujo
#    -> tratar -> montar dashboards) só pra garantir que nada quebrou; não
#    compara nada, só confere que os scripts rodam sem lançar erro.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-atualizado:
    name: public/index.html está em dia com o CSV commitado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruir dashboard a partir do CSV já commitado
        run: |
          set -e
          pip install -r requirements.txt
          cd scripts
          python gerar_dashboard.py
          python gerar_dashboard_html.py

      - name: Comparar com o que está commitado
        run: |
          set -e
          if ! git diff --quiet -- public; then
            echo "::error::public/index.html está desatualizado. Rode 'python scripts/gerar_dashboard_html.py' localmente e comite o resultado."
            git diff --stat -- public
            exit 1
          fi

  pipeline-completo:
    name: Pipeline completo roda sem erro (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar o pipeline do zero
        run: |
          set -e
          pip install -r requirements.txt
          cd scripts
          python gerar_dados.py
          python tratar_dados.py
          python gerar_dashboard.py
          python gerar_dashboard_html.py
